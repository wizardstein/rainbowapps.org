<!doctype html>
<!--
  Source for public/og.png (1200×630 Open Graph card).
  Regenerate: open this file in a browser at a 1200×630 viewport and screenshot it
  (e.g. Playwright: page.setViewportSize({width:1200,height:630}); page.screenshot({path:'public/og.png'})).
  Keep the text in sync with the hero in SPEC.md §6.1.
-->
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>RainbowApps OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: #fbf8f2; color: #2b2723;
      font-family: "Nunito Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { position: relative; width: 1200px; height: 630px; padding: 84px 80px; box-sizing: border-box; }
    .brand { font-family: "Nunito", sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.3px; }
    h1 {
      font-family: "Nunito", sans-serif; font-weight: 800; font-size: 72px; line-height: 1.12;
      letter-spacing: -2px; margin: 120px 0 0; max-width: 980px;
    }
    .line {
      margin-top: 28px; width: 288px; height: 5px; border-radius: 3px;
      background: linear-gradient(90deg, #E2574C, #F0933D, #EFC23F, #55A45E, #3FA39B, #4E7FD0, #8B66C6);
    }
    .tag {
      position: absolute; left: 80px; bottom: 84px;
      font-size: 26px; color: #6e675c; letter-spacing: -0.2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">RainbowApps</div>
    <h1>Ai o idee bună?<br>O construiesc, de la 0 lei.</h1>
    <div class="line"></div>
    <div class="tag">Aplicații pentru idei bune, de la 0 lei. — Adelin, Cluj</div>
  </div>
</body>
</html>
