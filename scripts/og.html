<!doctype html>
<!--
  Source for public/og.png (1200×630 Open Graph card).
  Regenerate: open this file in a browser at a 1200×630 viewport and screenshot it
  (e.g. Playwright: page.setViewportSize({width:1200,height:630}); page.screenshot({path:'public/og.png'})).
  Keep the text in sync with the site title in app/layout.tsx (portfolio redesign, 2026-11-06).
-->
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>RainbowApps OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: #f6f4ee; color: #15141a;
      font-family: "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { position: relative; width: 1200px; height: 630px; padding: 84px 80px; box-sizing: border-box; }
    .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.3px; }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 76px; line-height: 1.04;
      letter-spacing: -2.6px; margin: 116px 0 0; max-width: 1000px;
    }
    .line {
      margin-top: 28px; width: 288px; height: 5px; border-radius: 3px;
      background: linear-gradient(90deg, #E2574C, #F0933D, #EFC23F, #55A45E, #3FA39B, #4E7FD0, #8B66C6);
    }
    .tag {
      position: absolute; left: 80px; bottom: 84px;
      font-size: 26px; color: #5b5966; letter-spacing: -0.2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">RainbowApps</div>
    <h1>Aplicații și site-uri<br>pentru oameni cu idei bune.</h1>
    <div class="line"></div>
    <div class="tag">Gratuit pentru ONG-uri și cauze bune. — Adelin, Cluj</div>
  </div>
</body>
</html>
